<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cully</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/polish.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#/"><img src="/favicon.svg" alt="" width="26" height="26"><span>cully</span></a>
    <nav id="nav" aria-label="Sections">
      <a data-route="agents" href="#/">Tasks <span id="badge" class="badge" hidden></span></a>
      <a data-route="board" href="#/board">Board</a>
      <a data-route="sessions" href="#/sessions">Sessions <span id="sbadge" class="badge" hidden></span></a>
      <details id="navmore" class="menu navmore">
        <summary aria-label="More sections">More <span id="morebadge" class="badge" hidden></span></summary>
        <div class="menu-pop navpop">
          <a data-route="team" href="#/agents">Agents</a>
          <a data-route="harness" href="#/harness">Harness</a>
          <a data-route="dashboard" href="#/dashboard">Dashboard <span id="dbadge" class="badge" hidden></span></a>
        </div>
      </details>
    </nav>
    <div class="meta"><button id="inboxbtn" class="inboxbtn" hidden aria-haspopup="true" aria-expanded="false"></button><button id="mcpchip" class="mcpchip" hidden></button><button id="pausebtn" class="pausebtn" hidden aria-pressed="false"></button><span id="notifywrap" class="themewrap"><button id="notifybtn" class="themebtn" aria-label="Notifications" title="Notifications"></button></span><span id="themewrap" class="themewrap"><button id="themebtn" class="themebtn" aria-label="Change theme" title="Change theme"></button></span><span id="live" class="live" title="Connection to the Cully server">live</span><span id="meta"></span></div>
  </header>
  <div id="where" class="where" hidden></div>
  <div id="banner" class="banner" hidden></div>

  <main id="view-agents" class="view agents-view">
    <aside class="rail" aria-label="Tasks">
      <a class="newbtn" href="#/"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New task</a>
      <div id="taskpanel"></div>
      <div id="rail"></div>
    </aside>
    <section id="stage" class="stage"></section>
  </main>

  <main id="view-harness" class="view" hidden><div id="harness" class="boardwrap"></div></main>

  <main id="view-team" class="view" hidden><div id="team" class="boardwrap"></div></main>

  <main id="view-sessions" class="view" hidden><div id="sessions" class="boardwrap"></div></main>

  <main id="view-board" class="view" hidden><div id="board" class="boardwrap"></div></main>

  <main id="view-dashboard" class="view dash-view" hidden>
    <nav id="panels" class="panels" aria-label="Dashboard panels"></nav>
    <section id="panel" class="panelout"></section>
  </main>

  <div id="modal-root"></div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <script src="/md.js"></script>
  <script src="/ledger.js"></script>
  <script src="/graph.js"></script>
  <script src="/app.js"></script>
  <script src="/palette.js" defer></script>
</body>
</html>
