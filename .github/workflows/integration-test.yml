name: Integration Test
on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  pull_request:
    paths-ignore: ['README.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: cully_test
          POSTGRES_USER: cully_test
          POSTGRES_PASSWORD: cully_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cully_test -d cully_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CULLY_TEST_DATABASE_URL: postgresql://cully_test:cully_test@127.0.0.1:5432/cully_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: PostgreSQL and OAuth MCP integration tests
        run: go test ./internal/store/postgres ./migrations -race -count=1 -v
