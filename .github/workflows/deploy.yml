name: Deploy

# Publishes Cully to the MCP Runtime public preview (platform.mcpruntime.org)
# using the documented server-author flow: build image -> push -> deploy.
# Cully lives in the shared catalog namespace (mcp-servers, from .mcp
# metadata) with no publish scope; the platform runs in tenant mode, so
# --scope org/public would be rejected. The token must belong to an admin.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cully
  cancel-in-progress: false

env:
  MCP_RUNTIME_VERSION: v0.6.1
  MCP_RUNTIME_SHA256: 0f8ea74b54be043763fbf105245b8894b00b2bbe17beb3516b44ae0c43fb0165
  MCP_PLATFORM_API_URL: https://platform.mcpruntime.org
  SERVER_NAME: cully
  IMAGE_REGISTRY: registry.mcpruntime.org/org/cully-mcp

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      MCP_PLATFORM_API_TOKEN: ${{ secrets.MCP_PLATFORM_API_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install mcp-runtime CLI
        run: |
          curl -fsSL -o mcp-runtime \
            "https://github.com/tavric-labs/mcp-runtime/releases/download/${MCP_RUNTIME_VERSION}/mcp-runtime-linux-amd64"
          echo "${MCP_RUNTIME_SHA256}  mcp-runtime" | sha256sum -c -
          sudo install -m 0755 mcp-runtime /usr/local/bin/mcp-runtime
          rm mcp-runtime
          mcp-runtime --version

      - name: Check platform credentials
        run: |
          if [ -z "${MCP_PLATFORM_API_TOKEN}" ]; then
            echo "::error::MCP_PLATFORM_API_TOKEN secret is not set"
            exit 1
          fi
          mcp-runtime auth status

      - name: Validate metadata
        run: mcp-runtime server validate --metadata-dir .mcp

      - name: Build image
        run: |
          tag="$(git rev-parse --short=7 HEAD)"
          mcp-runtime server build image "${SERVER_NAME}" --registry "${IMAGE_REGISTRY}" --tag "${tag}" --platform linux/amd64 --metadata-dir .mcp
          image="$(yq ".servers[] | select(.name == \"${SERVER_NAME}\") | .image + \":\" + .imageTag" .mcp/servers.yaml)"
          echo "Built ${image}"
          echo "IMAGE=${image}" >> "$GITHUB_ENV"

      - name: Push image
        run: mcp-runtime server push --image "${IMAGE}"

      - name: Deploy server
        run: mcp-runtime server deploy "${SERVER_NAME}" --metadata-dir .mcp --update

      - name: Summary
        run: echo "Deployed \`${SERVER_NAME}\` with image \`${IMAGE}\` to ${MCP_PLATFORM_API_URL}" >> "$GITHUB_STEP_SUMMARY"
