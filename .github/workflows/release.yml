name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check versioned release notes
        run: test -f ".github/release-notes/${GITHUB_REF_NAME}.md"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check the plugins match their generator
        run: go test ./internal/cully -run 'PluginFiles|PluginHooks' -count=1
      - name: Package the plugins
        run: |
          mkdir -p dist-plugins
          for agent in claude cursor codex; do
            (cd "plugins/$agent" && zip -qr "../../dist-plugins/cully-plugin-$agent.zip" .)
          done
      # goreleaser replaces the whole release body with --release-notes, so its
      # footer would be ignored. Compose the notes here instead.
      - name: Compose the release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          {
            cat ".github/release-notes/$TAG.md"
            printf '\n## Install the plugins from this release\n\n'
            printf 'Pin the plugin marketplaces to this tag. The plugins add Cully'"'"'s hooks and skill; use one install route per agent, and connect memory with `cully mcp add` since you run the MCP server yourself.\n\n'
            printf '```sh\n'
            printf 'claude plugin marketplace add tavric-labs/cully@%s\n' "$TAG"
            printf 'claude plugin install cully@cully\n'
            printf 'codex plugin marketplace add tavric-labs/cully --ref %s\n' "$TAG"
            printf '```\n\n'
            printf 'Each plugin is also attached as `cully-plugin-claude.zip`, `cully-plugin-cursor.zip` and `cully-plugin-codex.zip`. See the [plugin guide](https://docs.cully.net/plugins).\n'
          } > release-notes-composed.md
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean --release-notes release-notes-composed.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  marketplace-submissions:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      # Anthropic's directory and the Cursor Marketplace accept a plugin only
      # through a reviewed submission, which no workflow can make. Open one
      # tracked checklist per release so it is not forgotten.
      - name: Open the marketplace submission checklist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          title="Submit Cully plugins to the agent directories: $TAG"
          if [ -n "$(gh issue list --state all --search "\"$title\" in:title" --json number --jq '.[0].number')" ]; then
            echo "checklist already exists"; exit 0
          fi
          gh issue create --title "$title" --body "Release $TAG published the plugins in the Claude Code and Codex marketplaces, which are this repository, and attached them as zips. These two directories accept a plugin only through a reviewed submission that a person must make:

          - [ ] **Anthropic's directory** (needs a paid claude.ai plan): submit in the developer portal at https://claude.ai/directory/manage. Run 'claude plugin validate ./plugins/claude' first. The portal's strict check also asks for a version, which the plugin omits on purpose so repository-marketplace users track the repository; decide on a version before submitting.
          - [ ] **Cursor Marketplace**: submit https://github.com/${GH_REPO} at https://cursor.com/marketplace/publish. The repository root carries .cursor-plugin/marketplace.json.
          - [ ] **Codex**: OpenAI documents plugin hooks as supported only for plugins installed manually, and not for its public directory, so there is nothing to submit.

          The Cully MCP server is not part of any listing: users deploy it on their own infrastructure.

          Plugin guide: https://docs.cully.net/plugins"
  service-images:
    needs: release
    uses: ./.github/workflows/publish-images.yml
    with:
      tag: ${{ github.ref_name }}
