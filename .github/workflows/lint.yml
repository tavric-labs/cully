name: Lint
on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  pull_request:
    paths-ignore: ['README.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go formatting
        run: test -z "$(gofmt -l cmd internal migrations skills tests)"
      - name: Go vet
        run: go vet ./...
      - name: Shell syntax
        run: |
          for script in install.sh deploy/bootstrap-personal-data.sh deploy/bootstrap-website.sh deploy/self-hosted/setup.sh; do
            sh -n "$script"
          done
      - name: Installer behavior
        run: python3 -m unittest discover -s tests -p 'test_install.py' -v
      - name: Self-hosted Compose configurations
        env:
          CULLY_DB_NAME: cully
          CULLY_DB_USER: cully
          CULLY_DB_PASSWORD: ci-db-password
          CULLY_DATABASE_URL: postgres://cully:ci-db-password@db:5432/cully
          CULLY_DATA_API_TOKEN: ci-data-token
          CULLY_MCP_OWNER: ci-owner
          CULLY_MEM0_DB_PASSWORD: ci-mem0-db-password
          CULLY_MEM0_API_KEY: ci-mem0-api-key
          CULLY_MEM0_JWT_SECRET: ci-jwt-secret
        run: |
          cd deploy/self-hosted
          docker compose --env-file .env.example -f compose.yaml config --quiet
          CULLY_MCP_AUTH_MODE=oauth CULLY_MCP_OWNER='' docker compose --env-file .env.example -f compose.yaml --profile oauth config --quiet
          CULLY_MCP_AUTH_MODE=oauth CULLY_MCP_OWNER='' docker compose --env-file .env.example -f compose.yaml --profile oauth --profile mcp-auth config --quiet
          CULLY_MCP_AUTH_IMAGE=example/mcp-auth:ci \
          CULLY_MCP_AUTH_CONFIG_DIR="$PWD/../login-methods/config" \
          CULLY_MCP_AUTH_ENV_FILE="$PWD/mcp-auth.env.example" \
          CULLY_AUTH_ISSUER=https://auth.example.com \
          CULLY_AUTH_RESOURCE=https://mcp.example.com/mcp \
          CULLY_MCP_AUTH_MODE=oauth CULLY_MCP_OWNER='' \
            docker compose --env-file .env.example -f compose.yaml -f compose.custom-auth.yaml --profile oauth config --quiet
      - name: Personal Compose configuration
        run: |
          cd deploy
          CULLY_DATA_TAG=v0.0.0 docker compose --env-file personal-data.env.example -f compose.personal-data.yaml config --quiet
      - name: Login-method deployment configuration (no images started)
        env:
          MCP_AUTH_IMAGE: princekrroshan01/mcp-auth-server:ci-unreleased
          CULLY_IMAGE_TAG: v0.0.0
          MCP_AUTH_PROVIDER_ENV_FILE: ./provider.env.example
        run: |
          cd deploy/login-methods
          docker compose --env-file .env.example --profile ops config --quiet
          python3 -m json.tool config/login-methods.ldap.example.json > /dev/null
          python3 -m json.tool config/login-methods.google.example.json > /dev/null
