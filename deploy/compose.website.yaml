services:
  cully-web:
    image: ghcr.io/tavric-labs/cully-web:${CULLY_WEB_REVISION:?set deployment commit}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    volumes: [testimonials:/var/lib/cully-web]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    expose: ["8080"]
    networks: [workspace]
volumes:
  testimonials:
networks:
  workspace:
    external: true
    name: workspace_workspace
