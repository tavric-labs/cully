services:
  cully-docs:
    image: ghcr.io/tavric-labs/cully-docs:${CULLY_DOCS_REVISION:?set deployment commit}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    expose: ["8080"]
    networks: [workspace]
networks:
  workspace:
    external: true
    name: workspace_workspace
